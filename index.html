<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dots" />
  <meta name="description" content="Count down the days of any goal, one dot per day." />
  <title>Dots — Days Left</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- List view -->
  <main id="list-view" class="view">
    <header class="topbar">
      <h1>Dots</h1>
      <button id="add-btn" class="icon-btn primary" aria-label="Add countdown">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      </button>
    </header>
    <ul id="task-list" class="task-list"></ul>
    <section id="empty-state" class="empty" hidden>
      <div class="empty-dots" aria-hidden="true"></div>
      <h2>No countdowns yet</h2>
      <p>Track any goal one day at a time — every dot is a day.</p>
      <button id="empty-add-btn" class="btn primary">Add your first countdown</button>
    </section>
  </main>

  <!-- Detail view -->
  <main id="detail-view" class="view" hidden>
    <header class="topbar">
      <button id="back-btn" class="icon-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <h1 id="detail-title" class="truncate"></h1>
      <button id="edit-btn" class="icon-btn" aria-label="Edit countdown">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z" /></svg>
      </button>
    </header>

    <section class="hero">
      <div class="hero-main">
        <span id="days-left" class="big-num">0</span>
        <span id="days-left-label" class="big-label">days left</span>
      </div>
      <div id="day-of" class="day-of"></div>
      <div class="timers">
        <div class="timer">
          <span class="timer-label">Next day in</span>
          <span id="next-day-timer" class="timer-value mono">--:--:--</span>
        </div>
        <div class="timer">
          <span class="timer-label">Deadline in</span>
          <span id="deadline-timer" class="timer-value mono">--</span>
        </div>
      </div>
      <div class="progress" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>
    </section>

    <section class="grid-wrap">
      <div id="dot-grid" class="dot-grid" role="img"></div>
      <div class="legend">
        <span><i class="dot past"></i>Done</span>
        <span><i class="dot today"></i>Today</span>
        <span><i class="dot future"></i>Left</span>
      </div>
    </section>
    <div id="dot-tip" class="dot-tip" hidden></div>
  </main>

  <!-- Add / edit sheet -->
  <dialog id="task-dialog" class="sheet">
    <form id="task-form" method="dialog">
      <h2 id="dialog-title">New countdown</h2>

      <label class="field">
        <span>Name</span>
        <input id="f-name" name="name" type="text" maxlength="60" placeholder="e.g. Exam prep" required />
      </label>

      <label class="field">
        <span>Total days</span>
        <input id="f-total" name="total" type="number" inputmode="numeric" min="1" max="3650" value="100" required />
      </label>

      <fieldset class="field">
        <legend>Starting point</legend>
        <div class="segmented">
          <input type="radio" id="mode-day" name="mode" value="day" checked />
          <label for="mode-day">I'm on day…</label>
          <input type="radio" id="mode-date" name="mode" value="date" />
          <label for="mode-date">Start date</label>
        </div>
        <input id="f-current" name="current" type="number" inputmode="numeric" min="1" value="1" aria-label="Current day" />
        <input id="f-start" name="start" type="date" aria-label="Start date" hidden />
        <small id="f-hint" class="hint"></small>
      </fieldset>

      <fieldset class="field">
        <legend>Colour</legend>
        <div id="f-colors" class="swatches"></div>
      </fieldset>

      <div class="actions">
        <button type="button" id="delete-btn" class="btn danger" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" id="cancel-btn" class="btn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
