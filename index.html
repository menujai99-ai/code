<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dots & Years" />
  <meta name="description" content="Count down days and years, one dot at a time." />
  <title>Dots &amp; Years</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="dots/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="dots/icon.svg" />
  <style>
    :root {
      --bg: #f6f5f2;
      --surface: #ffffff;
      --text: #17181c;
      --muted: #6b6d75;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 6px 20px rgba(0, 0, 0, 0.06);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --surface: #181b21;
        --text: #eceef2;
        --muted: #9196a1;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 16px)
               calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 16px);
      display: flex;
      flex-direction: column;
    }
    h1 { margin: 8px 0 4px; font-size: 32px; font-weight: 750; letter-spacing: -0.02em; }
    .lead { margin: 0 0 24px; color: var(--muted); }
    .apps { display: grid; gap: 14px; }
    .app {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px;
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
    }
    .app:active { transform: scale(0.99); }
    .app img { width: 64px; height: 64px; border-radius: 16px; flex: none; }
    .app-text { flex: 1; min-width: 0; }
    .app-name { display: block; font-size: 20px; font-weight: 700; }
    .app-what { display: block; color: var(--muted); font-size: 14px; }
    .app-status { display: block; margin-top: 4px; font-size: 14px; font-weight: 600; }
    .dots .app-status { color: #e8590c; }
    .years .app-status { color: #1c7ed6; }
    .btc .app-status { color: #e34948; }
    .chev { color: var(--muted); font-size: 26px; line-height: 1; }
  </style>
</head>
<body>
  <main>
    <h1>Dots &amp; Years</h1>
    <p class="lead">Count down what matters, one dot at a time.</p>
    <nav class="apps">
      <a class="app dots" href="dots/">
        <img src="dots/icon.svg" alt="" />
        <span class="app-text">
          <span class="app-name">Dots</span>
          <span class="app-what">One dot per day — countdowns and deadlines.</span>
          <span class="app-status" id="dots-status"></span>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
      <a class="app years" href="years/">
        <img src="years/icon.svg" alt="" />
        <span class="app-text">
          <span class="app-name">Years</span>
          <span class="app-what">One dot per year — your life and long goals.</span>
          <span class="app-status" id="years-status"></span>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
      <a class="app btc" href="btc/">
        <img src="btc/icon.svg" alt="" />
        <span class="app-text">
          <span class="app-name">BTC Range</span>
          <span class="app-what">Likely Bitcoin price ranges — next hour, day and week.</span>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
    </nav>
  </main>
  <script>
    // Both apps store their data on this same site, so the counts can be shown here.
    function count(key) {
      try {
        const list = JSON.parse(localStorage.getItem(key) || '[]');
        return Array.isArray(list) ? list.length : 0;
      } catch {
        return 0;
      }
    }
    const d = count('dots.tasks.v1');
    const y = count('years.items.v1');
    document.getElementById('dots-status').textContent = d ? `${d} countdown${d === 1 ? '' : 's'}` : '';
    document.getElementById('years-status').textContent = y ? `${y} item${y === 1 ? '' : 's'}` : '';
  </script>
</body>
</html>
